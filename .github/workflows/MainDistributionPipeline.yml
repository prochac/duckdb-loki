#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  # An unfiltered `push:` builds every ref that moves. Restricting it to main and release tags
  # keeps a branch that also has an open PR from building twice (once as `push`, once as
  # `pull_request`).
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Group by commit, not by ref: cutting a release tag on a commit that is already building as a
# main push would otherwise run the whole matrix a second time for identical output — the
# tag-aware steps in _extension_distribution.yml are gated on `extension_tag`/`duckdb_tag`, which
# this workflow does not pass. The tag run now supersedes the main run instead (which is left
# CANCELLED in main's history — that entry is the duplicate we chose not to pay for).
#
# The trade-off: pushing several commits to main in quick succession no longer collapses into a
# single run, since each commit is now its own group. That is more runner time, but every commit
# on main gets built rather than only the last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: loki
      # cpp-httplib + OpenSSL do live HTTP(S) at scan time, which the WebAssembly
      # targets cannot do. Skip them so the pipeline stays green (mirrors
      # description.yml's excluded_platforms).
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'

  # Only the format check runs via the reusable workflow: it just runs clang-format/black
  # over the sources and needs no build. The tidy check does configure CMake (to emit
  # compile_commands.json), which requires our vcpkg dependencies (openssl/yyjson/httplib)
  # — and the reusable workflow has no way to set up vcpkg. So tidy runs as its own job below.
  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: loki
      format_checks: 'format'

  tidy-check:
    name: Tidy Check
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
      GEN: ninja
      TIDY_THREADS: 4
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: x64-linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/checkout@v4
        name: Checkout Extension CI tools
        with:
          path: extension-ci-tools
          ref: v2.0-cyanoptera
          repository: duckdb/extension-ci-tools

      - name: Install
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build clang-tidy && sudo pip3 install pybind11[global] --break-system-packages

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.5
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

      # The stock tidy-check target omits VCPKG_MANIFEST_FLAGS (unlike the release target), so
      # vcpkg never installs our deps and find_package(yyjson) fails at configure. Inject the
      # manifest dir via EXT_FLAGS (a documented passthrough into the tidy configure's flags).
      - name: Tidy Check
        run: make tidy-check EXT_FLAGS="-DVCPKG_MANIFEST_DIR=${{ github.workspace }}"
